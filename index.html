<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traffic Tracker — Commute & Congestion Analytics</title>
    <meta
      name="description"
      content="Minimalist real-time traffic tracking dashboard with congestion heatmaps, daily, weekly, and monthly trendlines."
    />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚦</text></svg>" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="./dashboard/css/main.css" />
    <link rel="stylesheet" href="./dashboard/css/layout.css" />
    <link rel="stylesheet" href="./dashboard/css/components.css" />
    <link rel="stylesheet" href="./dashboard/css/charts.css" />

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  </head>
  <body>
    <div class="app-wrapper">
      <!-- Top Minimal Header & Navigation -->
      <header class="app-header">
        <div class="brand-section">
          <div class="brand-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
            </svg>
          </div>
          <div class="brand-title">Traffic Tracker</div>
          <div class="tz-pill" title="Rendered in Eastern Time">
            <span class="tz-dot"></span>
            <span>EDT</span>
          </div>
        </div>

        <!-- View Navigation Tabs -->
        <nav id="view-nav-container" class="header-view-nav" aria-label="Analytical Views"></nav>
      </header>

      <!-- Unified Minimal Controls Bar -->
      <section class="controls-bar" aria-label="Route, Direction, Metric, and Date Controls">
        <div class="controls-left">
          <div id="route-selector-container"></div>
          <div id="direction-toggle-container"></div>
          <div id="metric-selector-container"></div>
        </div>
        <div class="controls-right">
          <div id="date-picker-container"></div>
        </div>
      </section>

      <!-- Main Focused Chart Canvas -->
      <main class="chart-panel">
        <div id="chart-container" role="region" aria-label="Traffic Analytics Visualization"></div>
      </main>

      <!-- Minimal Footer -->
      <footer class="app-footer">
        <span>Traffic Tracker • EDT Timezone • GitHub Actions & TomTom</span>
      </footer>
    </div>

    <!-- Application ES Module Entrypoint -->
    <script type="module" src="./dashboard/js/app.js"></script>
  </body>
</html>
